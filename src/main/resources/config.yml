prefix: "&8[&4zVips&8] "

# Edit your database config here
database:
  # Here you can define how to store the plugin data.
  # OPTIONS:
  # - H2 (Preferred over SQLite)
  # - SQLite
  # - MariaDB (Preferred over MySQL)
  # - MySQL
  # DEFAULT: H2
  type: H2
  host: localhost
  port: 3306
  database: db
  username: root
  password: pass
  options:
    useSSL: false
    allowPublicKeyRetrieval: false
  # -------------------- #
  # WARNING: DO NOT CHANGE ANYTHING BELOW IF YOU DON'T KNOW WHAT YOU'RE DOING
  pool-size: 10
  table-prefix: zvips

general:
  # Here you can define the language of the plugin, all languages can be found, edited and created on languages' directory.
  # DEFAULT OPTIONS: [en, pt-br, <custom>] --- DEFAULT: en
  language: "en"
  # Here you can define if metrics should be on or off.
  # !WARNING: This option does not work with reload.
  # OPTIONS: [true, false] --- DEFAULT: true
  metrics: true
  # Should the plugin log errors and important information?
  # OPTIONS: [true, false] --- DEFAULT: true
  enable-logs: true

vip-options:
  # Ask the player for confirmation when using a key?
  # OPTIONS: [true, false] --- DEFAULT: true
  require-confirmation-for-key: true

  # Should the plugin check if the player has an empty inventory when activating vips?
  # OPTIONS: [true, false] --- DEFAULT: true
  require-empty-inventory: true

  # Should the plugin decrease the vip time even if not activated?
  # OPTIONS: [true, false] --- DEFAULT: false
  decrease-inactive-vips: false

  # ! Every cooldown defined here is in seconds.
  # OPTIONS: [>=0 INT]
  cooldowns:
    # Cooldown when changing between vips.
    changevip: 600
    # Cooldown when transferring vips to another player.
    transferkey: 600

party-vip:
  # How many points the server need to accumulate to activate the party vip.
  # OPTIONS: [>0 INT] --- DEFAULT: 250
  objective: 250

  activation:
    # What commands should be executed when the party vip is activated
    # Hint: Using [<chance>] before the command will give the command a chance to be executed (Chance = 0.0 to 100.0)
    # OPTIONS: [String] --- DEFAULT: []
    commands:
      - "eco giveall 1000"
      # - "[30.0] whatever"

commands:
  # Mostly everything below needs a restart to apply
  main:
    command: zvips
    description: "The main command for the plugin"
    permission: zvips.command.main # True by default
    cooldown: 0.0
    aliases: []
    # Sub command - Help
    help:
      permission: "zvips.command.main.help" # Only OP by default
    # Sub command - Version
    version:
      permission: "zvips.command.main.version" # True by default
    # Sub command - Reload
    reload:
      permission: "zvips.command.main.reload" # Only OP by default
    # Sub command - Converter
    converter:
      permission: "zvips.command.main.converter" # Only OP by default
  pointsvip:
    command: pointsvip
    description: "Manage player's points vip"
    permission: zvips.command.pointsvip # True by default
    cooldown: 0.0
    aliases:
      - "pontosvip"
    others:
      permission: "zvips.command.pointsvip.others" # Only OP by default
    # Sub command - Set/Give/Remove/Reset
    manage:
      permission: "zvips.command.pointsvip.manage" # Only OP by default
  partyvip:
    command: partyvip
    description: "Manage party vip progress"
    permission: zvips.command.partyvip # True by default
    cooldown: 0.0
    aliases:
      - "vipparty"
    # Sub command - Set/Add/Remove/Reset
    manage:
      permission: "zvips.command.partyvip.manage" # Only OP by default
  givekey:
    command: givekey
    description: "Give keys to players"
    permission: zvips.command.givekey # Only OP by default
    cooldown: 0.0
    aliases:
      - "darkey"
  genkey:
    command: genkey
    description: "Generate server keys"
    permission: zvips.command.genkey # Only OP by default
    cooldown: 0.0
    aliases:
      - "gerarkey"
  listkeys:
    command: listkeys
    description: "List keys"
    permission: zvips.command.listkeys # True by default
    cooldown: 0.0
    aliases:
      - "listarkeys"
    # See other player keys or server keys
    others:
      permission: zvips.command.listkeys.others # Only OP by default
  usekey:
    command: usekey
    description: "Use a key"
    permission: zvips.command.usekey # True by default
    cooldown: 0.0
    aliases:
      - "usarkey"
    # Use a key on a player
    others:
      permission: zvips.command.usekey.others # Only OP by default
  transferkey:
    command: transferkey
    description: "Transfer a key to a player"
    permission: zvips.command.transferkey # Only OP by default
    cooldown: 0.0
    aliases:
      - "transferirkey"
  deletekey:
    command: deletekey
    description: "Deletes a key from the database"
    permission: zvips.command.deletekey # Only OP by default
    cooldown: 0.0
    aliases:
      - "deletarkey"

# In this section you can define the permissions for the plugin
# Permissions for commands can be found on the commands section
permissions:
  bypass:
    # This permission allows the player to bypass changevip cooldowns
    # Default: zvips.bypass.changevip
    changevip: "zvips.bypass.changevip" # Only OP by default
    # This permission allows the player to bypass transferkey cooldowns
    # Default: zvips.bypass.transferkey
    transferkey: "zvips.bypass.transferkey" # Only OP by default
    # This permission allows the player to bypass the cost of the command
    # Default: %command_permission%.command-cost
    command-cost: "%command_permission%.bypass.command-cost" # Only OP by default