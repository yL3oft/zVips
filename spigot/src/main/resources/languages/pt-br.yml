# Aqui você pode gerenciar mensagens de integração
hooks:
  vault:
    cant-afford-command: "%prefix%&cVocê precisa de &6$%cost% &cpara executar este comando."

# Mensagens relacionadas a comandos
commands:
  # Aqui em cima você vai achar mensagens que podem ser utilizadas em vários comandos
  no-permission: "%prefix%&cVocê não tem permissão para executar este comando."
  in-cooldown: "%prefix%&cVocê deve esperar %timeleft% segundos antes de usar este comando novamente."
  cant-find-player: "%prefix%&cEste jogador não foi encontrado."
  cant-find-vip: "%prefix%&cEsse VIP não foi encontrado."
  cant-find-key: "%prefix%&cEssa Key não foi encontrada."
  only-executable-by-players: "%prefix%&cEste comando só pode ser executado por jogadores."
  string-not-a-number: "%prefix%&cPor favor, insira um número válido."
  invalid-duration: "%prefix%&cPor favor, insira uma duração válida (30d, 1d, 1h...)."

  key-information:
    1color: "&6"
    2color: "&a"
    message: |-
      %1color%Key: %2color%%key%
      %1color%ID: %2color%%id%
      %1color%VIP: %2color%%vip%
      %1color%Duração: %2color%%duration_formatted%
      %1color%Usos: %2color%%uses%
      %1color%Dono: %2color%%owner%

  # Aqui embaixo vai achar mensagens especificas de alguns comandos.
  main:
    help:
      help-perm: |-
        %prefix%&bUsos de &e/%command%&b:
        &c-> &e/%command% &a(help|?)
        &c-> &e/%command% &a(reload|rl) &6[all, commands, config, languages]
        &c-> &e/%command% &a(version|ver) &6[update]
      help-noperm: |-
        %prefix%&bUsos de &e/%command%&b:
        &c-> &e/%command% &a(help|?)
        &c-> &e/%command% &a(version|ver)
    version:
      output: "%prefix%&bVersão atual: &a%version%"
    reload:
      usage: |-
        %prefix%&bUsos de &e/%command% &a(reload|rl)&b:
        &c-> &e/%command% &a(reload|rl) &6[all, commands, config, languages]
      output: "%prefix%&aPlugin recarregado em &b%time%ms!"
      commands:
        output: "%prefix%&aTodos comandos do plugin foram recarregados em &b%time%ms!"
      config:
        output: "%prefix%&aA configuração do plugin foi recarregada em &b%time%ms!"
      languages:
        output: |-
          %prefix%&aAs linguas do plugin foram recarregadas em &b%time%ms!
          &7Nota: Isso não ira recarregar a lingua no config.yml, use '/%command% reload config' para isso.
    converter:
      usage: |-
        %prefix%&bUsos de &e/%command% &aconverter&b:
        &c-> &e/%command% &aconverter sqlitetoh2
        &c-> &e/%command% &aconverter sqlitetomysql
        &c-> &e/%command% &aconverter sqlitetomariadb
        &c-> &e/%command% &aconverter mysqltosqlite
        &c-> &e/%command% &aconverter mysqltoh2
        &c-> &e/%command% &aconverter mariadbtosqlite
        &c-> &e/%command% &aconverter mariadbtoh2
        &c-> &e/%command% &aconverter h2tosqlite
        &c-> &e/%command% &aconverter h2tomysql
        &c-> &e/%command% &aconverter h2tomariadb
      output: "%prefix%&aTodos dados foram convertidos!"
      error: "%prefix%&cAlgo deu errado na conversão dos dados, por favor verifique o console do seu servidor."
  pointsvip:
    usage: |-
      %prefix%&bUsos de &e/%command%&b:
      &c-> &e/%command% &6[player]
      &c-> &e/%command% &adefinir (player) (points)
      &c-> &e/%command% &aadicionar (player) (points)
      &c-> &e/%command% &aremover (player) (points)
      &c-> &e/%command% &aresetar (player)
    output: "%prefix%&aVocê tem &b%points% &apontos vip."
    others:
      output: "%prefix%&a%player% tem &b%points% &apontos vip."
    set:
      output: "%prefix%&aOs pontos de %player% foram definidos para &b%points%&a."
    add:
      output: "%prefix%&aAdicionado &b%points% &apontos vip a %player%."
    remove:
      output: "%prefix%&aRemovido &b%points% &apontos vip de %player%."
    reset:
      output: "%prefix%&aOs pontos vip de %player% foram resetados."
  partyvip:
    usage: |-
      %prefix%&bUsos de &e/%command%&b:
      &c-> &e/%command%
      &c-> &e/%command% &adefinir (points)
      &c-> &e/%command% &aadicionar (points)
      &c-> &e/%command% &aremover (points)
      &c-> &e/%command% &aresetar
    output: "%prefix%&aProgresso atual da party vip: &b%points%/%goal%&a."
    set:
      output: "%prefix%&aProgresso da party vip definido para &b%points%&a."
    add:
      output: "%prefix%&a%points% foi adicionado ao progresso da party vip que está agora em: &b%points%/&b%goal%&a."
    remove:
      output: "%prefix%&a%points% foi removido do progresso da party vip que está agora em: &b%points%/&b%goal%&a."
    reset:
      output: "%prefix%&aProgresso da party vip resetado!"
  givekey:
    usage: "%prefix%&c-> /givekey (Jogador) (VIP) [Duração] [Usos]"
    output: |-
      %prefix%&aChave dada a %player%:
      %key-information%
  genkey:
    usage: "%prefix%&c-> /genkey (VIP) [Duração] [Usos]"
    output: |-
      %prefix%&aCriada nova chave do servidor:
      %key-information%
  listkeys:
    usage: "%prefix%&c-> /listkeys [Jogador]"
    output: |-
      %prefix%&dTodas as chaves do servidor:
      %server-keys%
    output-player: |-
      %prefix%&dChaves de %player%:
      %player-keys%
    output-you: |-
      %prefix%&dSuas chaves:
      %keys%
    server-keys: "&d-> %key% &7(ID: %id%, VIP: %vip%, Duração: %duration_formatted%, Usos: %uses%)"
    player-keys: "&d-> %key% &7(VIP: %vip%, Duração: %duration_formatted%, Usos: %uses%)"
    player-keys-admin: "&d-> %key% &7(ID: %id%, VIP: %vip%, Duração: %duration_formatted%, Usos: %uses%)"
  usekey:
    usage: "%prefix%&c-> /usekey (Chave)"
    usage-admin: "%prefix%&c-> /usekey (Chave) [Jogador]"
    # Output está dentro do arquivo vip da CHAVE
    output-admin: "%prefix%&aFez &e%player% &ausar a chave &b%key%"
  transferkey:
    usage: "%prefix%&c-> /transferkey (ID) (Jogador)"
    output: "%prefix%&aChave &b%key% &atransferida para &e%player%"
  deletekey:
    usage: "%prefix%&c-> /deletekey (ID)"
    output: "%prefix%&aChave deletada."