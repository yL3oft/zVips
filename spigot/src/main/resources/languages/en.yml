# Here you can manage hook messages
hooks:
  vault:
    cant-afford-command: "%prefix%&cYou need &6$%cost% &cin order to execute this command."

# Messages related to commands
commands:
  # Up here you will find messages that can be used in multiple commands
  no-permission: "%prefix%&cYou don't have permission to execute this command."
  in-cooldown: "%prefix%&cYou must wait %timeleft% seconds before using this command again."
  cant-find-player: "%prefix%&cThis player was not found."
  cant-find-vip: "%prefix%&cVIP was not found."
  cant-find-key: "%prefix%&cKey was not found."
  only-executable-by-players: "%prefix%&cThis command can only be executed by players."
  string-not-a-number: "%prefix%&cPlease provide a valid number."
  invalid-duration: "%prefix%&cPlease provide a valid duration type (30d, 1d, 1h...)."

  key-information:
    1color: "&6"
    2color: "&a"
    message: |-
      %1color%Key: %2color%%key%
      %1color%ID: %2color%%id%
      %1color%VIP: %2color%%vip%
      %1color%Duration: %2color%%duration_formatted%
      %1color%Uses: %2color%%uses%
      %1color%Owner: %2color%%owner%

  # Below you will find messages specific for the commands
  main:
    help:
      help-perm: |-
        %prefix%&bUsages of &e/%command%&b:
        &c-> &e/%command% &a(help|?)
        &c-> &e/%command% &a(reload|rl) &6[all, commands, config, languages]
        &c-> &e/%command% &a(version|ver) &6[update]
      help-noperm: |-
        %prefix%&bUsages of &e/%command%&b:
        &c-> &e/%command% &a(help|?)
        &c-> &e/%command% &a(version|ver)
    version:
      output: "%prefix%&bCurrent version: &a%version%"
    reload:
      usage: |-
        %prefix%&bUsages of &e/%command% &a(reload|rl)&b:
        &c-> &e/%command% &a(reload|rl) &6[all, commands, config, languages]
      output: "%prefix%&aReloaded plugin in &b%time%ms&a."
      commands:
        output: "%prefix%&aReloaded all plugin commands in &b%time%ms&a."
      config:
        output: "%prefix%&aReloaded plugin config file in &b%time%ms&a."
      languages:
        output: |-
          %prefix%&aReloaded plugin languages in &b%time%ms&a.
          &7Note: This will not update the language from config.yml, use '/%command% reload config' to do that.
    converter:
      usage: |-
        %prefix%&bUsages of &e/%command% &aconverter&b:
        &c-> &e/%command% &aconverter sqlitetoh2
        &c-> &e/%command% &aconverter sqlitetomysql
        &c-> &e/%command% &aconverter sqlitetomariadb
        &c-> &e/%command% &aconverter mysqltosqlite
        &c-> &e/%command% &aconverter mysqltoh2
        &c-> &e/%command% &aconverter mariadbtosqlite
        &c-> &e/%command% &aconverter mariadbtoh2
        &c-> &e/%command% &aconverter h2tosqlite
        &c-> &e/%command% &aconverter h2tomysql
        &c-> &e/%command% &aconverter h2tomariadb
      output: "%prefix%&aAll data converted!"
      error: "%prefix%&cSomething went wrong converting the data, please check your server console."
  pointsvip:
    usage: |-
      %prefix%&bUsages of &e/%command%&b:
      &c-> &e/%command% &6[player]
      &c-> &e/%command% &aset (player) (points)
      &c-> &e/%command% &aadd (player) (points)
      &c-> &e/%command% &aremove (player) (points)
      &c-> &e/%command% &areset (player)
    output: "%prefix%&aYour vip points: &b%points%&a."
    others:
      output: "%prefix%&a%player%'s vip points: &b%points%&a."
    set:
      output: "%prefix%&aSet %player%'s vip points to &b%points%&a."
    add:
      output: "%prefix%&aAdded &b%points% &ato %player%'s vip points."
    remove:
      output: "%prefix%&aRemoved &b%points% &afrom %player%'s vip points."
    reset:
      output: "%prefix%&aReset %player%'s vip points."
  partyvip:
    usage: |-
      %prefix%&bUsages of &e/%command%&b:
      &c-> &e/%command%
      &c-> &e/%command% &aset (points)
      &c-> &e/%command% &aadd (points)
      &c-> &e/%command% &aremove (points)
      &c-> &e/%command% &areset
    output: "%prefix%&aParty vip current progress: &b%points%/%goal%&a."
    set:
      output: "%prefix%&aParty vip progress set to &b%points%&a."
    add:
      output: "%prefix%&a%points% has been added to the party vip which now is at: &b%progress%/&b%goal%&a."
    remove:
      output: "%prefix%&a%points% has been removed from the party vip which now is at: &b%progress%/&b%goal%&a."
    reset:
      output: "%prefix%&aParty vip progress reset!"
  givekey:
    usage: "%prefix%&c-> /%command% (Player) (VIP) [Duration] [Uses]"
    output: |-
      %prefix%&aGave %player% key:
      %key-information%
  genkey:
    usage: "%prefix%&c-> /%command% (VIP) [Duration] [Uses]"
    output: |-
      %prefix%&aCreated new server key:
      %key-information%
  listkeys:
    output: |-
      %prefix%&dAll server keys:
      %keys%
    output-player: |-
      %prefix%&d%player%'s keys:
      %keys%
    output-you: |-
      %prefix%&dYour keys:
      %keys%
    server-keys: "&d-> %key% &7(ID: %id%, VIP: %vip%, Duration: %duration_formatted%, Uses: %uses%)"
    player-keys: "&d-> %key% &7(VIP: %vip%, Duration: %duration_formatted%, Uses: %uses%)"
    player-keys-admin: "&d-> %key% &7(ID: %id%, VIP: %vip%, Duration: %duration_formatted%, Uses: %uses%)"
  usekey:
    usage: "%prefix%&c-> /%command% (Key)"
    usage-admin: "%prefix%&c-> /%command% (Key) [Player]"
    # Output is inside the KEY's vip file
    output-admin: "%prefix%&aMade &e%player% &ause key &b%key%"
  transferkey:
    usage: "%prefix%&c-> /%command% (ID) (Player)"
    output: "%prefix%&aKey &b%key% &atransferred to &e%player%"
  deletekey:
    usage: "%prefix%&c-> /%command% (ID)"
    output: "%prefix%&aDeleted key %key%"